<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>管理员 · 捐赠记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }
        .admin-card {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
            padding: 30px 28px 38px;
            align-self: flex-start;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 28px;
            border-bottom: 1px solid #eaeef5;
            padding-bottom: 18px;
        }
        .admin-header h1 {
            font-size: 24px;
            font-weight: 550;
            color: #0b1e33;
            letter-spacing: -0.2px;
        }
        .admin-header .badge {
            background: #eef3f9;
            padding: 6px 16px;
            border-radius: 40px;
            color: #1f3a57;
            font-size: 14px;
            font-weight: 450;
            border: 1px solid #dce4ee;
        }
        .stats {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            background: #f9fcff;
            padding: 16px 22px;
            border-radius: 40px;
            margin-bottom: 28px;
            border: 1px solid #e9eff6;
        }
        .stats span {
            font-size: 15px;
            color: #2d405b;
        }
        .stats strong {
            font-weight: 600;
            color: #0b1e33;
            margin-left: 4px;
        }
        .record-list {
            margin-top: 6px;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f8;
            transition: background 0.1s ease;
            border-radius: 12px;
        }
        .record-item:hover {
            background: #f8fafd;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-amount {
            font-weight: 550;
            font-size: 18px;
            color: #1a314b;
            background: #f1f6fd;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            word-break: break-all;
            max-width: 50%;
        }
        .record-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .record-time {
            font-size: 14px;
            color: #62748b;
            background: #f2f6fc;
            padding: 2px 12px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .record-id {
            font-size: 12px;
            color: #8b9db3;
            font-family: monospace;
            background: #f2f6fc;
            padding: 2px 10px;
            border-radius: 30px;
        }
        .record-raw {
            font-size: 12px;
            color: #8b9db3;
            background: #f2f6fc;
            padding: 2px 10px;
            border-radius: 30px;
            font-style: italic;
        }
        .empty-state {
            text-align: center;
            padding: 48px 20px 40px;
            color: #7b8da5;
            font-size: 16px;
            background: #fafcfe;
            border-radius: 40px;
            border: 1px dashed #d7e0eb;
        }
        .empty-state p {
            margin-top: 8px;
            font-size: 14px;
        }
        .refresh-btn {
            background: transparent;
            border: 1px solid #d0dbe8;
            border-radius: 40px;
            padding: 8px 22px;
            font-size: 14px;
            color: #1f3a57;
            cursor: pointer;
            transition: 0.15s;
            background: white;
            font-weight: 450;
        }
        .refresh-btn:hover {
            background: #eef3f9;
            border-color: #b0c4db;
        }
        .footer-tip {
            margin-top: 28px;
            font-size: 13px;
            color: #9aadc4;
            text-align: right;
            border-top: 1px solid #eef3f9;
            padding-top: 18px;
        }
        .footer-tip small {
            background: #f2f7fe;
            padding: 3px 14px;
            border-radius: 40px;
        }
        .clear-btn {
            background: transparent;
            border: 1px solid #e2e9f2;
            border-radius: 40px;
            padding: 5px 16px;
            font-size: 13px;
            color: #7a8fa8;
            cursor: pointer;
            transition: 0.1s;
            margin-left: 10px;
        }
        .clear-btn:hover {
            background: #f1f5fc;
            border-color: #c0d0e2;
            color: #4a627c;
        }
        @media (max-width: 500px) {
            .admin-card { padding: 22px 16px; }
            .admin-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .stats { flex-direction: column; gap: 6px; align-items: flex-start; }
            .record-item { flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 0; }
            .record-meta { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .record-amount { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="admin-card" id="adminApp">
        <div class="admin-header">
            <h1>📋 捐赠管理 · 记录</h1>
            <div>
                <button class="refresh-btn" id="refreshBtn">↻ 刷新</button>
                <button class="clear-btn" id="clearBtn">清除所有</button>
            </div>
        </div>

        <div class="stats" id="statsBar">
            <span>总捐赠笔数 <strong id="totalCount">0</strong></span>
            <span>累计金额 <strong id="totalAmount">0</strong> ¥</span>
            <span>最新捐赠 <strong id="latestTime">—</strong></span>
        </div>

        <div class="record-list" id="recordList">
            <div class="empty-state">
                <div style="font-size: 40px; margin-bottom: 8px;">📭</div>
                <p>暂无捐赠记录</p>
                <p style="font-size: 13px; margin-top: 6px;">用户捐赠后数据将在此显示</p>
            </div>
        </div>

        <div class="footer-tip">
            <small>🔒 本地存储</small>
        </div>
    </div>

    <script>
        (function() {
            const recordListEl = document.getElementById('recordList');
            const totalCountEl = document.getElementById('totalCount');
            const totalAmountEl = document.getElementById('totalAmount');
            const latestTimeEl = document.getElementById('latestTime');
            const refreshBtn = document.getElementById('refreshBtn');
            const clearBtn = document.getElementById('clearBtn');

            // 判断是否为有效数字
            function isNumericAmount(val) {
                if (typeof val === 'number') return true;
                if (typeof val === 'string') {
                    const num = Number(val);
                    return !isNaN(num) && num >= 1;
                }
                return false;
            }

            // 转换为数字
            function toNumeric(val) {
                if (typeof val === 'number') return val;
                if (typeof val === 'string') {
                    const num = Number(val);
                    if (!isNaN(num)) return num;
                }
                return 0;
            }

            function renderRecords() {
                let records = [];
                try {
                    const stored = localStorage.getItem('donation_records');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            records = parsed;
                        }
                    }
                } catch (e) {
                    records = [];
                }

                records.sort((a, b) => {
                    if (a.timestamp && b.timestamp) {
                        return b.timestamp.localeCompare(a.timestamp);
                    }
                    return (b.id || 0) - (a.id || 0);
                });

                const total = records.length;
                let sum = 0;
                records.forEach(r => {
                    if (isNumericAmount(r.amount)) {
                        sum += toNumeric(r.amount);
                    }
                });
                const sumDisplay = Number.isInteger(sum) ? sum.toFixed(0) : sum.toFixed(2);
                const latestTime = (total > 0 && records[0].timestamp) ? records[0].timestamp : '—';

                totalCountEl.textContent = total;
                totalAmountEl.textContent = sumDisplay;
                latestTimeEl.textContent = latestTime;

                if (total === 0) {
                    recordListEl.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 40px; margin-bottom: 8px;">📭</div>
                            <p>暂无捐赠记录</p>
                            <p style="font-size: 13px; margin-top: 6px;">用户捐赠后数据将在此显示</p>
                        </div>
                    `;
                    return;
                }

                let listHtml = '';
                records.forEach((rec, index) => {
                    // 优先使用 display 字段（计算结果），否则使用 amount
                    let displayAmount = rec.display || rec.amount;
                    const amount = rec.amount;
                    const time = rec.timestamp || '未知时间';
                    let shortId = rec.id ? String(rec.id).slice(-6) : `#${index+1}`;
                    if (shortId.length > 8) shortId = shortId.slice(-6);
                    
                    // 显示金额：如果是数字加¥，否则直接显示
                    let amountDisplay = '';
                    if (typeof displayAmount === 'number') {
                        amountDisplay = `¥ ${displayAmount}`;
                    } else if (typeof displayAmount === 'string') {
                        const num = Number(displayAmount);
                        if (!isNaN(num) && displayAmount.trim() !== '') {
                            amountDisplay = `¥ ${num}`;
                        } else {
                            amountDisplay = displayAmount;
                        }
                    } else {
                        amountDisplay = String(displayAmount);
                    }

                    // 如果有原始输入且与显示不同，显示原始输入（用于展示表达式）
                    let rawHtml = '';
                    if (rec.raw && rec.raw !== String(displayAmount) && rec.raw !== String(amount)) {
                        rawHtml = `<span class="record-raw">📝 ${rec.raw}</span>`;
                    }

                    listHtml += `
                        <div class="record-item">
                            <div class="record-amount">${amountDisplay}</div>
                            <div class="record-meta">
                                ${rawHtml}
                                <span class="record-time">${time}</span>
                                <span class="record-id">ID: ${shortId}</span>
                            </div>
                        </div>
                    `;
                });

                recordListEl.innerHTML = listHtml;
            }

            refreshBtn.addEventListener('click', renderRecords);

            clearBtn.addEventListener('click', function() {
                if (confirm('确定清除所有捐赠记录吗？')) {
                    localStorage.removeItem('donation_records');
                    renderRecords();
                }
            });

            renderRecords();

            window.addEventListener('storage', function(e) {
                if (e.key === 'donation_records') {
                    renderRecords();
                }
            });

            setInterval(renderRecords, 15000);
        })();
    </script>
</body>
</html>
